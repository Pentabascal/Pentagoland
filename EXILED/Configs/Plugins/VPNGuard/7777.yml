# Enable debug messages in the console.
debug: false
# Optional API key for proxycheck.io. Leave empty for the free keyless tier (100/day), or get a free key at https://proxycheck.io/ for 1000/day.
proxy_check_api_key: ''
# Catches more VPN endpoints but can produce false positives on some mobile/business connections. Cloud gaming (GeForce NOW, Xbox Cloud, etc.) runs from datacenters, so keep the allowlist below in sync when enabling this.
block_hosting_providers: false
# Allowlist of ISP/provider name substrings (case-insensitive) that are NEVER kicked, even if flagged. Matched against the ISP, provider and hostname. Use this for legitimate cloud gaming services.
allowed_isps:
- nvidia
- geforce now
- microsoft
- shadow
- blade group
- boosteroid
# Allowlist of ASN numbers that are NEVER kicked, even if flagged (e.g. "AS20347" or "20347"). Add the ASNs of cloud gaming providers you want to allow.
allowed_asns: []
# The reason players will see when they are kicked by the plugin.
kick_reason: >-
  Kicked for using a VPN or Proxy!

  If you think this is a mistake, please contact a server staff!
# Optional: Put your Discord webhook URL here to get notified when a player is kicked.
webhook: ''

      escape_text_uncuffed: 'As a Containment Engineer Scientist, you''''re unable to escape, unless you''''re detained.'
      # The text that is shown if the player is cuffed, and needs to be uncuffed to escape
      escape_text_cuffed: 'You''re unable to escape unless you''re not detained'
      # The text that is shown if the player is unable to escape as a whole.
      escape_text_both: 'You''re unable to escape'
      escape_text_time: 5
      use_hints: true
      allowed_uncuffed_escape: false
      allowed_cuffed_escape: true

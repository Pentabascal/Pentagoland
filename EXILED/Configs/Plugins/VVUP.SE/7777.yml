  fakeout_respawn_announcements_chaos_cassie_text: 'Advertencia. Personal militar ha entrado en las instalaciones. Designado como <color=green>Insurgencia del Caos</color>.'
  # What should the fakeout cassie announcement say for Serpents
  fakeout_respawn_announcements_serpents_cassie: 'Serpents Hand hasentered'

  fakeout_respawn_announcements_serpents_cassie_text: 'La Mano de la Serpiente ha entrado en las instalaciones.'
  # What should the fakeout cassie announcement say for UIU
  fakeout_respawn_announcements_u_i_u_alive_s_c_p_s_cassie: 'The U I U Squad designated {designation} HasEntered AllRemaining AwaitingRecontainment {scpnum}'
  fakeout_respawn_announcements_u_i_u_s_c_p_s_dead_cassie: 'The U I U Squad designated {designation} HasEntered AllRemaining NoSCPsLeft'
  # What should the fakeout cassie text say for UIU
  fakeout_respawn_announcements_u_i_u_alive_s_c_p_s_cassie_text: 'La unidad UIU, con designación {designation}, ha entrado en las instalaciones. Se espera la recontención de {scpnum}.'
  fakeout_respawn_announcements_u_i_u_s_c_p_s_dead_cassie_text: 'La unidad UIU, con designación {designation}, ha entrado en las instalaciones. Permanece una amenaza considerable; actúa con precaución.'
  # Should the rapid fire tesla gate event work?
  rapid_fire_telsa_event: true

  # What should the broadcast be to inform players it's safe to use medical items again?
  unsafe_medical_items_safe_to_use_text: 'Ya puedes volver a usar objetos médicos.'
  # Should fakeout announcements for respawn waves run?
  fakeout_respawn_announcements_event: true

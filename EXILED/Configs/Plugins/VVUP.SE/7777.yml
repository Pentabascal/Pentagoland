  # Should SCPs be affected by this as well?
  death_match_event_affects_s_c_ps: false
  # What health value should players health be set at?
  death_match_health: 1
  # Should the Chaos Event be able to enable other events?
  chaos_event_enables_other_events: true
  # Should the other events that get activated end when the next cycle comes along?
  chaos_event_ends_other_events: false
  # Should the FBI Open Up Event be active?
  f_b_i_open_up_event: true
  # What should the broadcast say to the target that's going to be teleported too

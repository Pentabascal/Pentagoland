# Is the plugin enabled?
is_enabled: true
debug: false
# Mostrar un resumen final limpio en los laterales de la pantalla.
final_scoreboard_enabled: true
# Segundos de espera tras finalizar la ronda antes de mostrar el resumen.
final_scoreboard_delay: 2.5
# Duración del resumen final en segundos.
final_scoreboard_duration: 12
# Mostrar a los espectadores la cuenta atrás de las oleadas normales y mini-oleadas.
respawn_countdown_enabled: true
# Intervalo de actualización del contador de oleadas en segundos.
respawn_countdown_refresh_interval: 1
# Número de líneas verticales para colocar el contador en la zona inferior central sin tapar el centro de la pantalla.
respawn_countdown_vertical_padding: 6
# Can events randomly start?
randomly_starting_events: false
# What is the chance of the events running?
random_event_starting_chance: 0
# The list of events that can randomly start, Valid options: Blackout, 173Infection, 173Hydra, Chaotic, Short, FreezingTemps, NameRedacted, VariableLights, LowGravity, ItemRandomizer, AfterHours, NoSpectatingPlayers
random_events_allowed_to_start:
- 'Blackout'
- '173Infection'
- '173Hydra'
- 'Chaotic'
- 'Short'
- 'FreezingTemps'
- 'NameRedacted'
- 'VariableLights'
- 'LowGravity'
- 'AfterHours'
- 'ItemRandomizer'
- 'NoSpectatingPlayers'
blackout_config:
  start_event_cassie_message: 'Fallo del sistema eléctrico'
  start_event_cassie_text: 'Fallo del sistema eléctrico. (evento de apagón iniciado)'
  end_event_cassie_message: 'Sistema eléctrico restablecido'
  end_event_cassie_text: 'Sistema eléctrico restablecido. (evento de apagón terminado)'
  # Should the Blackout Event end when all 3 generators activate?
  generator_ends_event: true
  # What item should the player recieve when the blackout event starts?
  blackout_event_starting_item:
  - Lantern
  # Set to true if you want the lights to flicker before going out for good.
  flicker_lights: false
  # How long should the lights flicker before going out? (in seconds)
  flicker_duration: 5
chaotic_config:
  start_event_cassie_message: 'La instalación es inestable'
  start_event_cassie_text: 'La instalación es inestable (evento caótico)'
  # Determines how long before the next chaos event (in seconds)
  time_for_chaos_event: 60
  # Should the Chaotic Event reroll if a specific event is disabled?
  chaotic_event_reroll_if_a_specific_event_is_disabled: true
  # The time for Broadcasts to be shown on the screen (this applies to all broadcasts that the Chaotic Event uses)
  broadcast_display_time: 10
  # Should the item steal chaos event run?
  item_steal_event: true
  # What should the broadcast say when players items has been stolen
  item_stolen_text: 'Parece que te han robado los objetos'
  # Should give random items chaos event run?
  give_random_item_event: true
  # What should the broadcast say when an item is given
  give_random_item_text: 'Has obtenido un objeto'
  # Should random items only be regular items or use custom items as well?
  give_random_item_customitems: false
  # Should random teleport chaos event run?
  random_teleport_event: true
  # If the Random Teleport Event is active, should players be teleported to Light after decomtamination?
  teleport_to_light_after_decom: false
  # If the Random Teleport Event is active, should players be teleported into the facility after the warhead detonated?
  teleport_to_facility_after_nuke: false
  # What should the broadcast say when a player gets teleported?
  random_teleport_text: 'Vaya, ha sido culpa mía'
  # Should the fake autonuke chaos event run?
  fake_auto_nuke: true
  # What should the broadcast say for when the fake auto nuke starts (this should match your real autonuke text to make it more conviencing
  fake_auto_nuke_start_text: 'Ha comenzado la auto-detonación'
  # What should the broadcast say for when it is reviealed that the auto nuke was fake
  fake_auto_nuke_fakeout_text: '¡Era una broma!'
  # What should be the time before the nuke goes off before its shown to be a fake, note that anything below 10 seconds wont work
  fake_auto_nuke_time_out: 15
  # Should the old nuke time be restored after the fake out? Otherwise it will be at 30 seconds
  fake_auto_nuke_restores_old_time: true
  # Should the remove weapons chaos event run?
  remove_weapons_event: true
  # What should the broadcast text say when a weapon is taken away?
  remove_weapons_text: 'Espero que no pensaras entrar en combate ahora'
  # Should the give random weapon event be active?
  give_random_weapons_event: true
  # Should the random weapon giving only apply to people who dont have weapons?
  give_random_weapons_to_unarmed_players: true
  # What should the broadcast text say when a weapon is given?
  give_random_weapons_text: 'Toma, un arma'
  # What should the broadcast say if the player's inventory is full and cannot recieve a weapon
  give_random_weapons_text_fail: 'No free weaponry for you, bawomp'
  # Should all weapons be up for grabs?
  give_all_random_weapons: true
  # If giving all weapons is false, what weapons can be given?
  give_random_weapons_defined:
  - GunCOM15
  - GunCOM18
  - GunCrossvec
  # Should the death match event be active?
  death_match_event: true
  # What should the broadcast say when players health is reduced?

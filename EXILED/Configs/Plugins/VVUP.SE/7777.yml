  f_b_i_open_up_m_t_f_text: 'Fight or Flight.'
  # How long should it take before the foundation gets teleported to the target?
  f_b_i_teleport_time: 5
  # Should the grenade feet event be active?
  grenade_feet_event: true
  # Should grenade fuses be random?
  grenade_feet_random_fuse: true
  # How long should the fuse on the grenades be if it's not random?

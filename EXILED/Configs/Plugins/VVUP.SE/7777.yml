  # What should the broadcast be before the grenades drop on people?
  grenade_feet_text: 'Ten cuidado por dónde pisas.'
  # Should unsafe medical items event be active?
  unsafe_medical_items_event: true
  # What should the broadcast be for unsafe medical items?
  unsafe_medical_items_text: 'Usa los objetos médicos con cuidado'
  # Should unsafe medical items use a random time for the event?
  unsafe_medical_items_use_random_time: true
  # If random time for the event is off, how long should Unsafe Medical Items run for?

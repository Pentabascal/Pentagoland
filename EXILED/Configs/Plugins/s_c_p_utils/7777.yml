# You have to add the team you want to protect from the target as key and enemy teams on the list as value, on github documentation you can see all the teams.
cuffed_immunity_players:
  ClassD:
  - Scientists
  - FoundationForces
  Scientists:
  - ClassD
  - ChaosInsurgency
# Indicates if the protected teams should be cuffed to get the protection, if you don't add a team it will get protection regardless
cuffed_protected_teams:
- ClassD
- Scientists
# Set the allowed list that players can chose to swap if said SCP is not spawned, the request will be granted immediately.
allowed_swap_generation_list:
- Scp049
- Scp079
- Scp096
- Scp106
- Scp173
- Scp939
- Scp3114
# Set disallowed SCPs to use swap if said scp is not spawned, players can still use normal swap (for example 079 cannot become 173 if 173 is not spawned)
disallowed_scps_swap_generation_list:
- Scp0492
- Scp079
# Indicates in which zones the protected team is protected, Zone list: Surface, Entrance, HeavyContainment, LightContainment, Unspecified
cuffed_safe_zones:
  ClassD:
  - Entrance
  - Surface
  - HeavyContainment
  - LightContainment
  - Other
  - Unspecified
  Scientists:
  - Entrance
  - Surface
  - HeavyContainment
  - LightContainment
  - Other
  - Unspecified

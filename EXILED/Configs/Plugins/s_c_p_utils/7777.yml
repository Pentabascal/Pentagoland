- 'su_resp'
- 'resp'
# Broadcast to send to all online staff when player enter with more than 1 account
alert_staff_broadcast_multi_account:
# The broadcast content
  content: |-
    <size=40><color=red>Alert</color></size>
    <size=35>Player <color=yellow>{player}</color> has entered with <color=yellow>{accountNumber}</color> accounts</size>
    <size=30>Check console pressing <color=yellow>ò</color></size>
  # The broadcast duration
  duration: 10
  # The broadcast type
  type: Normal
  # Indicates whether the broadcast should be shown
  show: true
# Broadcast to send to all online staff when player change IP
alert_staff_broadcast_change_i_p:
# The broadcast content
  content: |-
    <size=40><color=red>Alert</color></size>
    <size=35>Player <color=yellow>{player}</color> has changed IP. <color=yellow>{oldIP}</color> to <color=yellow>{newIP}</color></size>
    <size=35>Check console pressing <color=yellow>ò</color></size>
  # The broadcast duration
  duration: 10
  # The broadcast type
  type: Normal
  # Indicates whether the broadcast should be shown
  show: true
debug: true

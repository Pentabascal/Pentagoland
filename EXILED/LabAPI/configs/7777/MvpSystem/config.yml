# Enable debug logs
debug: false
# MVP music to be played with steamid as key and music file name as value, make sure the files are in Mvp/Music folder
mvp_music:
  steamid: name.ogg
  steamid2: name.ogg
# Volume of the MVP music. 100 = normal, lower is quieter, higher amplifies (can distort above 100).
music_volume: 100
# Point weights used to decide who deserves to be MVP. The player with the highest total score becomes the MVP.
scoring:
# Minimum score a player must reach to be eligible for the MVP title. If nobody reaches it, no MVP is announced so the title is never given to someone who did nothing.
  minimum_score: 5
  # Points awarded for each kill made as a human.
  per_human_kill: 2
  # Points awarded for each kill made as an SCP.
  per_scp_kill: 2
  # Points awarded for each SCP the player killed (killing an SCP is high impact).
  per_scp_killed: 8
  # Points awarded per point of damage dealt.
  per_damage: 0.0199999996
  # Points awarded for successfully escaping the facility.
  escape: 4
  # Extra points for the player who escaped first (fastest).
  first_escape_bonus: 4
  # Extra points for the player who killed an SCP first (fastest).
  first_scp_kill_bonus: 4
  # Base points awarded for earning any tracked achievement.
  achievement_base: 3
  # Additional points per achievement priority rank (higher priority achievements are worth more).
  achievement_priority_bonus: 0.300000012
# If the StatsSystem plugin is present, it will count it if this is true
stats_system_integration: true
# Duration of broadcast, might need to be increased if round end time set in config is longer
duration: 30
# Set text format shared between stats with tags and display text you want to appear at the top
start: <size=31><line-height=0.9em>
# Format used for MVP title
mvp_title: <color=#78e2ff><b>{name}</b></color> es el MVP.
# Format used for each stat, if set to no text/empty the stat will not be displayed
most_kills_as_scp: <color=#78e2ff><b>{name}</b></color> consiguió más bajas como <color=#ff0000><b>{role}</b></color> (<color=#45ff7a><b>{kills}</b></color> en total)
first_to_kill_scp: <color=#78e2ff><b>{name}</b></color> fue el primero en eliminar a un <color=#ff0000><b>SCP</b></color>
# Replaces first_to_kill_scp if player has more than one kill
most_scps_killed: <color=#78e2ff><b>{name}</b></color> eliminó a {scps}
most_scps_killed_list_item: <color=#ff0000><b>{scp}</b></color>
most_kills_as_human: <color=#78e2ff><b>{name}</b></color> consiguió más bajas como humano (<color=#45ff7a><b>{kills}</b></color> en total)
first_to_escape: <color=#78e2ff><b>{name}</b></color> fue el primero en escapar en <color=#45ff7a><b>{time}</b></color> como <b>{role}</b>
best_achievement: <color=#78e2ff><b>{name}</b></color> obtuvo <color=#45ff7a><b>{achievement}</b></color> - {description}
most_damage_dealt: <color=#78e2ff><b>{name}</b></color> infligió más daño (<color=#45ff7a><b>{damage}</b></color>)
# Close out tags from the Start and display text you want to appear at the bottom
end: </line-height></size>
# Achievements to be tracked during the round. Order of achievements determine priority, ones closer to the top override lower ones. contains all valid achievements by default(christmas, halloween and They Are Just Resources... are missing due to techinal reasons)
